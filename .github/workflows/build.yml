
name: Prepare Otto Desk source

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract XiaoZhi source
        run: |
          unzip -q xiaozhi-esp32-main.zip -d source
          test -f source/xiaozhi-esp32-main/scripts/build.py

      - name: Extract Otto Desk overlay
        run: |
          unzip -q otto-desk-stage2-source-overlay.zip -d overlay
          test -d overlay/otto-desk-stage2-work/main/boards/otto-desk

      - name: Apply Otto Desk overlay
        run: |
          cp -a overlay/otto-desk-stage2-work/main/. \
            source/xiaozhi-esp32-main/main/

      - name: Verify Otto Desk registration
        run: |
          cd source/xiaozhi-esp32-main
          grep -q "BOARD_TYPE_OTTO_DESK" main/Kconfig.projbuild
          grep -q 'set(BOARD_DIR "otto-desk")' main/CMakeLists.txt
          test -f main/boards/otto-desk/config.h
          test -f main/boards/otto-desk/otto_emoji_display.cc
          test -f main/boards/otto-desk/otto_desk_controller_stub.cc
          echo "Otto Desk source overlay applied successfully."

      - name: Show hardware configuration
        run: |
          cd source/xiaozhi-esp32-main
          grep -n "OTTO_DESK_SERVO" main/boards/otto-desk/config.h
