
name: Build Otto Desk

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Otto Desk firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract XiaoZhi source
        shell: bash
        run: |
          unzip -q xiaozhi-esp32-main.zip -d source
          test -f source/xiaozhi-esp32-main/scripts/build.py

      - name: Extract Otto Desk overlay
        shell: bash
        run: |
          unzip -q otto-desk-stage2-source-overlay.zip -d overlay
          test -f overlay/otto-desk-stage2-work/main/boards/otto-desk/config.json

      - name: Apply Otto Desk overlay
        shell: bash
        run: |
          cp -a overlay/otto-desk-stage2-work/main/. \
            source/xiaozhi-esp32-main/main/

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd source/xiaozhi-esp32-main
          python scripts/build.py otto-desk --name otto-desk

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-desk-firmware
          path: source/xiaozhi-esp32-main/build/merged-binary.bin
          if-no-files-found: error
