
name: Build Otto Desk

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Otto Desk firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract final Otto Desk source
        shell: bash
        run: |
          unzip -q otto-desk-final-source-handoff-fixed2.zip -d source
          test -f source/xiaozhi-esp32-main/scripts/build.py
          test -f source/xiaozhi-esp32-main/main/boards/otto-desk/config.json

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd source/xiaozhi-esp32-main
          python scripts/build.py otto-desk --name otto-desk --language en-US --wake-word hiesp

      - name: Verify firmware
        shell: bash
        run: |
          test -s source/xiaozhi-esp32-main/build/merged-binary.bin
          stat -c 'Firmware size: %s bytes' source/xiaozhi-esp32-main/build/merged-binary.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-desk-firmware
          path: source/xiaozhi-esp32-main/build/merged-binary.bin
          if-no-files-found: error
